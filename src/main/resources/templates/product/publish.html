<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>发布商品 - SecondHub</title>

    <link rel="stylesheet" th:href="@{/css/base.css}" />
    <link rel="stylesheet" th:href="@{/css/layout.css}" />
    <link rel="stylesheet" th:href="@{/css/components/header.css}" />
    <link rel="stylesheet" th:href="@{/css/pages/publish.css}" />

    <script th:src="@{/js/pages/product-media-upload.js}" defer></script>
  </head>
  <body>
    <header th:replace="~{fragments/header :: siteHeader}"></header>

    <main class="container publish-container">
      <section class="publish-heading">
        <h1>发布二手商品</h1>
        <p>填写商品信息，让闲置物品找到新主人。</p>
      </section>

      <!-- 发布失败提示 -->
      <p
        class="field-error"
        th:if="${errorMessage}"
        th:text="${errorMessage}"
      ></p>

      <form
        class="publish-form"
        th:action="@{/products}"
        th:object="${productCreateRequest}"
        method="post"
        enctype="multipart/form-data"
      >
        <div class="form-group">
          <label for="name">商品名称</label>
          <input
            type="text"
            id="name"
            th:field="*{name}"
            placeholder="例如：二手 MacBook Air"
            maxlength="100"
            required
          />

          <p
            class="field-error"
            th:if="${#fields.hasErrors('name')}"
            th:errors="*{name}"
          ></p>
        </div>

        <div class="form-group">
          <label for="price">商品价格（元）</label>
          <input
            type="number"
            id="price"
            th:field="*{price}"
            placeholder="请输入商品价格"
            min="1"
            step="1"
            required
          />

          <p
            class="field-error"
            th:if="${#fields.hasErrors('price')}"
            th:errors="*{price}"
          ></p>
        </div>

        <div class="form-group">
          <label for="condition">商品成色</label>
          <select id="condition" th:field="*{condition}" required>
            <option value="">请选择商品成色</option>
            <option value="全新">全新</option>
            <option value="九成新">九成新</option>
            <option value="八成新">八成新</option>
            <option value="七成新及以下">七成新及以下</option>
          </select>

          <p
            class="field-error"
            th:if="${#fields.hasErrors('condition')}"
            th:errors="*{condition}"
          ></p>
        </div>

        <div class="form-group">
          <label for="category">商品分类</label>
          <select id="category" name="category" required>
            <option value="">请选择商品分类</option>
            <option value="数码产品">数码产品</option>
            <option value="游戏设备">游戏设备</option>
            <option value="学习用品">学习用品</option>
            <option value="生活用品">生活用品</option>
            <option value="其他">其他</option>
          </select>
        </div>

        <!-- 商品图片 -->
        <section class="form-group media-upload-section">
          <label for="images">商品图片</label>
          <p class="media-help">
            最多 9 张，每张不超过 5 MB。支持 JPG、PNG、WebP。
          </p>

          <label class="media-select-button" for="images">
            <span>选择图片</span>
            <input
              id="images"
              name="images"
              type="file"
              accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp"
              multiple
            />
          </label>

          <div id="imagePreviewList" class="media-preview-grid"></div>
          <p id="imageUploadHint" class="media-status" aria-live="polite"></p>
        </section>

        <!-- 商品视频 -->
        <section class="form-group media-upload-section">
          <label for="video">商品视频（选填）</label>
          <p class="media-help">
            最多 1 个，文件不超过 100 MB。支持 MP4、WebM。
          </p>

          <label class="media-select-button" for="video">
            <span>选择视频</span>
            <input
              id="video"
              name="video"
              type="file"
              accept="video/mp4,video/webm,.mp4,.webm"
            />
          </label>

          <div id="videoPreview" class="video-preview"></div>
          <p id="videoUploadHint" class="media-status" aria-live="polite"></p>
        </section>

        <div class="form-group">
          <label for="description">商品描述</label>
          <textarea
            id="description"
            th:field="*{description}"
            rows="6"
            maxlength="2000"
            placeholder="介绍商品的使用情况、外观、配件等"
            required
          ></textarea>

          <p
            class="field-error"
            th:if="${#fields.hasErrors('description')}"
            th:errors="*{description}"
          ></p>
        </div>

        <div class="form-actions">
          <a class="cancel-button" th:href="@{/}">取消</a>
          <button class="submit-button" type="submit">发布商品</button>
        </div>
      </form>
    </main>
  </body>
</html>
